<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Addie's 16th Birthday Card Insert</title>
    <style>
      @page {
        size: 5in 7in;
        margin: 0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: #ece8e3;
        font-family: "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif;
      }

      .insert {
        width: 5in;
        height: 7in;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.3in;
        padding: 0.55in;
        overflow: hidden;
        background: #fff;
        color: #6b3fa0;
        text-align: center;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        color: #ff3d9a;
        font-size: 0.62in;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1;
      }

      .message {
        max-width: 3.45in;
        font-size: 16px;
        line-height: 1.45;
      }

      .qr {
        width: 1.9in;
        height: 1.9in;
        display: block;
      }

      .scan {
        color: #ff3d9a;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        line-height: 1;
        text-transform: uppercase;
      }

      .signature {
        font-size: 15px;
        font-style: italic;
        line-height: 1.3;
      }

      @media print {
        html,
        body {
          width: 5in;
          height: 7in;
        }

        body {
          background: none;
        }

        .insert {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
      }
    </style>
  </head>
  <body>
    <main class="insert">
      <h1>Addie</h1>
      <p class="message">The real present wouldn't fit inside this card.</p>
      <img
        class="qr"
        src="qr.png"
        alt="Scan to open Addie's birthday present"
        width="1225"
        height="1225"
      />
      <p class="scan">Scan for your gift</p>
      <p class="signature">Love, Aunt Sam + Uncle Alex</p>
    </main>
  </body>
</html>
